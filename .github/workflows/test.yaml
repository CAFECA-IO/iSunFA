name: Unit & Integration Tests

on:
  push:
    branches:
      - feature/*
      - fix/*
      - hotfix/*
  pull_request:
    branches:
      - develop
      - main
env:
  DEWT_PRIVATE_KEY_PEM: ${{ secrets.DEWT_PRIVATE_KEY_PEM }}
  ISUNCOIN_ADDRESS: ${{ secrets.ISUNCOIN_ADDRESS }}
  ISUNCOIN_PRIVATE_KEY: ${{ secrets.ISUNCOIN_PRIVATE_KEY }}
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # Your job configurations here
  # Label of the container job
  backend-unit-tests:
    # Containers must run in Linux based operating systems
    runs-on: ubuntu-latest
    # Docker Hub image that `container-job` executes in
    container: node:22-slim
    env:
      # Info: (20260901 - Luphia) 只在本 job 生效（review 四輪低-3）：設在 workflow
      # 層級會讓日後新增的 job 一律繼承，而那些 job 不會裝 chromium——症狀是
      # 「puppeteer 指著一個不存在的路徑」。
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres
        # Provide the password for postgres
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - name: Set up openssl
        run: apt-get update -y && apt-get install -y openssl

      # Info: (20260901 - Luphia) header 版面測試（header_layout_320.test.ts）要在
      # 真的 Chromium 裡量 320px 的 scrollWidth（review #6731 三輪中-1）。
      # 本 job 的容器是 node:22-slim 且 PUPPETEER_SKIP_DOWNLOAD=true，原本沒有任何
      # 瀏覽器——沒有這一步，那條測試在 CI 是行程層級的 fail-open。
      # fonts-noto-cjk 不是裝飾：CJK 字寬正是那個缺陷的成因（中文逐字可斷），
      # 沒有 CJK 字型量出來的「登入」寬度是錯的。
      - name: Set up Chromium for layout tests
        run: apt-get install -y --no-install-recommends chromium fonts-noto-cjk
      # Downloads a copy of the code in your repository before running CI tests
      - name: Check out repository code
        uses: actions/checkout@v4

      # Performs a clean installation of all dependencies in the `package.json` file
      # For more information, see https://docs.npmjs.com/cli/ci.html
      - name: Install dependencies
        run: npm i

      - name: Connect to PostgreSQL
        # Runs a script that creates a PostgreSQL table, populates
        # the table with data, and then retrieves the data.
        run: npx prisma db push && npx prisma db seed
        env:
          # The database URL to connect to the PostgreSQL database
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

      # Info: (20260731 - Tzuhan) 全專案型別檢查:next build 只檢查應用相依圖可達的檔案,
      # Info: (20260731 - Tzuhan) 測試檔沒被 import 就完全不檢查;eslint 不做型別推導、jest 走轉譯也不檢查,
      # Info: (20260731 - Tzuhan) 因此測試檔的型別在此之前是沒有守門人的區域。排在測試之前:跑得快,且一次列出所有錯誤
      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests & integration tests
        run: npm run test
        env:
          # The database URL to connect to the PostgreSQL database
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

      # Info: (20260818 - Luphia) e2e 會真的建立與刪除資料列，因此自 PR #6652 起
      # Info: (20260818 - Luphia) 不再跟著 `npm test` 一起跑（開發者的 DATABASE_URL
      # Info: (20260818 - Luphia) 可能指向共用或 staging 庫，而唯一的閘只擋
      # Info: (20260818 - Luphia) NODE_ENV=production）。CI 用的是本 job 自建的
      # Info: (20260818 - Luphia) postgres service，資料是拋棄式的，因此明確跑這一步。
      - name: Run e2e tests (disposable database)
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

      - name: Build next.js service
        run: npm run build
