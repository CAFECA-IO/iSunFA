<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>寄送中</title>
  <style>
    <![CDATA[
    .mail-group {
      animation: flyOutToTopRight 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-box: view-box;
      transform-origin: 100px 100px;
    }
    .paper {
      fill: #ffffff;
      animation: paperInsert 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 0;
    }
    .paper-sheet { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15)); }
    .envelope-flap-front {
      fill: #ff7700;
      animation: flapClose 3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 100px 65px;
    }
    .envelope-flap-back { animation: flapFade 3s ease-in-out infinite; }
    .speed-line {
      stroke: #ffaa44;
      stroke-linecap: round;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      opacity: 0;
      animation: speedLineMove 3s ease-in-out infinite;
    }

    @keyframes paperInsert {
      0%   { transform: translateY(-28px); opacity: 0; }
      10%  { opacity: 1; }
      25%, 100% { transform: translateY(35px); }
    }
    @keyframes flapClose {
      0%, 30%   { transform: rotateX(180deg); fill: #ff8800; opacity: 0; }
      45%, 100% { transform: rotateX(0deg);   fill: #e66700; opacity: 1; }
    }
    @keyframes flapFade {
      0%, 30%   { opacity: 1; }
      45%, 100% { opacity: 0; }
    }
    @keyframes flyOutToTopRight {
      0%, 50%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      60%       { transform: translate(-10px, 10px) rotate(-8deg) scale(0.98); opacity: 1; }
      85%       { transform: translate(180px, -180px) rotate(20deg) scale(0.5); opacity: 0; }
      86%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
    }
    @keyframes speedLineMove {
      0%, 60%   { stroke-dashoffset: 20; opacity: 0; }
      68%       { stroke-dashoffset: 0; opacity: 0.8; }
      82%, 100% { stroke-dashoffset: -20; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mail-group, .paper, .envelope-flap-front, .envelope-flap-back, .speed-line {
        animation: none;
      }
      .paper { transform: translateY(35px); }
      .envelope-flap-front { fill: #e66700; }
      .envelope-flap-back { opacity: 0; }
    }
    ]]>
  </style>

  <line class="speed-line" x1="40" y1="160" x2="10" y2="185" stroke-width="3"/>
  <line class="speed-line" x1="20" y1="135" x2="-10" y2="155" stroke-width="4"/>
  <line class="speed-line" x1="60" y1="175" x2="35" y2="195" stroke-width="3"/>

  <g class="mail-group">
    <rect x="40" y="65" width="120" height="85" rx="6" fill="#ff7700"/>
    <path class="envelope-flap-back" d="M 40 65 L 40 45 L 100 14 L 160 45 L 160 65 Z" fill="#ff7700"/>

    <g class="paper">
      <rect class="paper-sheet" x="52" y="30" width="96" height="70" rx="3"/>
      <line x1="62" y1="42" x2="110" y2="42" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
      <line x1="62" y1="52" x2="138" y2="52" stroke="#edf2f7" stroke-width="3" stroke-linecap="round"/>
      <line x1="62" y1="62" x2="125" y2="62" stroke="#edf2f7" stroke-width="3" stroke-linecap="round"/>
      <line x1="62" y1="72" x2="140" y2="72" stroke="#edf2f7" stroke-width="3" stroke-linecap="round"/>
    </g>

    <path d="M 40 85 L 100 120 L 160 85 L 160 144 a 6 6 0 0 1 -6 6 L 46 150 a 6 6 0 0 1 -6 -6 Z" fill="#ff9900"/>
    <path d="M 40 145 L 100 105 L 160 145" fill="#ff9900" stroke="#ff69129e" stroke-width="1"/>

    <path class="envelope-flap-front" d="M 40 65 L 40 84 L 100 116 L 160 84 L 160 65 Z"/>
  </g>
</svg>
