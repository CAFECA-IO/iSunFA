<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>寄送中</title>
  <style>
    <![CDATA[
    .speed-line {
      stroke: #ffa033;
      stroke-linecap: round;
      stroke-dasharray: 15;
      stroke-dashoffset: 15;
      opacity: 0;
      animation: speedLine 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .mail-group {
      animation: mailFlight 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-box: view-box;
      transform-origin: 65px 125px;
    }
    .paper {
      fill: #ffffff;
      animation: paperInsert 3.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 65px 0;
    }
    .paper-sheet { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.1)); }
    .envelope-flap-front {
      fill: #ff7700;
      animation: flapClose 3.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 65px 100px;
    }
    .envelope-flap-back {
      fill: #ff7700;
      animation: flapFade 3.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 65px 100px;
      transform: rotate(180deg);
    }

    .mailbox-group {
      animation: mailboxBounce 3.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 200px 160px;
    }
    .success-star {
      fill: #40d5f6;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: starPop 3.5s ease-in-out infinite;
    }

    @keyframes paperInsert {
      0%   { transform: translateY(-22px); opacity: 0; }
      8%   { opacity: 1; }
      22%, 100% { transform: translateY(25px); }
    }
    @keyframes flapClose {
      0%, 25%   { transform: rotateX(180deg); fill: #ff8800; opacity: 0; }
      38%, 100% { transform: rotateX(0deg);   fill: #e66700; opacity: 1; }
    }
    @keyframes flapFade {
      0%, 25%   { opacity: 1; }
      38%, 100% { opacity: 0; }
    }
    @keyframes mailFlight {
      0%, 42%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      50%       { transform: translate(-12px, 8px) rotate(-12deg) scale(0.98); opacity: 1; }
      75%       { transform: translate(130px, -40px) rotate(18deg) scale(0.25); opacity: 0; }
      76%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
    }
    @keyframes speedLine {
      0%, 52%   { stroke-dashoffset: 15; opacity: 0; }
      60%       { stroke-dashoffset: 0; opacity: 0.8; }
      72%, 100% { stroke-dashoffset: -15; opacity: 0; }
    }
    @keyframes mailboxBounce {
      0%, 70%   { transform: scale(1) translateY(0); }
      74%       { transform: scale(1.05, 0.92) translateY(3px); }
      80%       { transform: scale(0.98, 1.03) translateY(-2px); }
      86%, 100% { transform: scale(1) translateY(0); }
    }
    @keyframes starPop {
      0%, 74%   { opacity: 0; transform: scale(0) rotate(0deg); }
      80%       { opacity: 1; transform: scale(1.2) rotate(45deg); }
      88%, 100% { opacity: 0; transform: scale(0.5) rotate(90deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .speed-line, .mail-group, .paper, .envelope-flap-front,
      .envelope-flap-back, .mailbox-group, .success-star {
        animation: none;
      }
      .paper { transform: translateY(25px); }
      .envelope-flap-front { fill: #e66700; }
      .envelope-flap-back { opacity: 0; }
    }
    ]]>
  </style>

  <line class="speed-line" x1="100" y1="135" x2="60" y2="155" stroke-width="3"/>
  <line class="speed-line" x1="120" y1="115" x2="80" y2="130" stroke-width="2.5"/>

  <g class="mailbox-group">
    <ellipse cx="200" cy="172" rx="32" ry="6" fill="#cbd5e0"/>

    <rect x="190" y="155" width="20" height="18" fill="#9b2c2c"/>
    <rect x="180" y="168" width="40" height="5" rx="2" fill="#742a2a"/>

    <path d="M 172 80 C 172 50, 228 50, 228 80 L 228 158 C 228 160, 172 160, 172 158 Z" fill="#e53e3e"/>
    <path d="M 172 80 C 172 50, 200 50, 200 80 L 200 159 L 172 158 Z" fill="#f56565" opacity="0.3"/>

    <rect x="180" y="82" width="40" height="10" rx="3" fill="#2d3748"/>
    <rect x="183" y="85" width="34" height="4" rx="1" fill="#1a202c"/>

    <circle cx="200" cy="118" r="8" fill="#ecc94b"/>
    <circle cx="200" cy="118" r="5" fill="#e53e3e"/>

    <path class="success-star" d="M 200 35 L 202 42 L 209 44 L 204 48 L 205 55 L 200 51 L 195 55 L 196 48 L 191 44 L 198 42 Z"/>
  </g>

  <g class="mail-group">
    <ellipse cx="65" cy="152" rx="30" ry="4" fill="#cbd5e0"/>

    <rect x="30" y="100" width="70" height="48" rx="4" fill="#ff7700"/>
    <path class="envelope-flap-back" fill="#ff8800" d="M 30 96 L 30 106 L 65 126 L 100 106 L 100 96 Z"/>

    <g class="paper">
      <rect class="paper-sheet" x="38" y="75" width="54" height="40" rx="2"/>
      <line x1="44" y1="83" x2="72" y2="83" stroke="#cbd5e0" stroke-width="2" stroke-linecap="round"/>
      <line x1="44" y1="90" x2="86" y2="90" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
      <line x1="44" y1="97" x2="78" y2="97" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    </g>

    <path d="M 30 112 L 65 132 L 100 112 L 100 144 a 4 4 0 0 1 -4 4 L 34 148 a 4 4 0 0 1 -4 -4 Z" fill="#ff9900"/>

    <path class="envelope-flap-front" d="M 30 96 L 30 106 L 65 126 L 100 106 L 100 96 Z"/>
  </g>
</svg>
