worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    server {
        # Info: (20260412 - Luphia) Automatically redirect HTTP to HTTPS
        listen 80;
        server_name localhost storage.localhost blockchain.localhost;
        return 301 https://$host$request_uri;
    }

    server {
        # Info: (20260412 - Luphia) Listen on 443 with SSL
        listen 443 ssl;
        server_name localhost;

        # Info: (20260412 - Luphia) Generated implicitly by entrypoint
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Info: (20260412 - Luphia) host.docker.internal resolves to the mac host where Next.js runs on 3000
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Info: (20260412 - Luphia) WebSocket support for Next.js HMR (Hot Module Replacement)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Info: (20260730 - Tzuhan) 安全網,非主要修正:此處原本未設 proxy_read_timeout,
            # Info: (20260730 - Tzuhan) nginx 預設 60s,而碳盤查的附件→段落管線實測約 87s(萃取 36.8s + 3 段草稿),
            # Info: (20260730 - Tzuhan) 使用者因此看到 504 與「系統錯誤」即使伺服端已跑完。
            # Info: (20260730 - Tzuhan) 真正的修正是逐段經 Centrifugo 推播(結果不依賴此連線存活);
            # Info: (20260730 - Tzuhan) 這裡放寬只是避免中途斷線的雜訊,不要靠它解決長工作。
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /connection/websocket {
            proxy_pass http://chatroom:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Centrifugo
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        # Info: (20260416 - Luphia) Proxy for storage.localhost -> IPFS/Storage server on 20022
        listen 443 ssl;
        server_name storage.localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://host.docker.internal:20022;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        # Info: (20260416 - Luphia) Proxy for blockchain.localhost -> RPC node on 20024
        listen 443 ssl;
        server_name blockchain.localhost;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://host.docker.internal:20024;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Info: (20260416 - Luphia) WebSockets support for RPC (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
