<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; }
  /* 刻意讓待輸出元素不在文件頂端,且左側有位移 —— 這正是 x/y 語意的風險所在 */
  #spacer { height: 137px; background:#333; }
  #wrap { padding-left: 41px; }
  #content { width: 794px; background:#fff; }
  .stripe { height: 10px; }
</style></head>
<body>
  <div id="spacer"></div>
  <div id="wrap"><div id="content"></div></div>
<script>
  // Info: 每條 10px 高的橫紋用顏色編碼自己的索引:r = idx & 255, g = idx >> 8
  // 讀回任一段 canvas 的某一列像素就能反解「這是第幾條」,
  // 藉此判斷段與段之間有沒有重疊或漏行。
  const N = 1200;
  const el = document.getElementById('content');
  let html = '';
  for (let i = 0; i < N; i++) {
    const r = i & 255, g = (i >> 8) & 255;
    html += '<div class="stripe" style="background:rgb(' + r + ',' + g + ',200)"></div>';
  }
  el.innerHTML = html;
  window.__STRIPES__ = N;
  window.__STRIPE_H__ = 10;
</script>
</body>
</html>
